<body data-page="contacts">
  <div id="app-loader" class="loader"><div class="loader-ring"></div><div>Загрузка</div></div>

    <a class="brand" href="index.html" data-site-logo>JOYSTICK</a>
    <button class="mobile-menu-btn" type="button" onclick="toggleMobileMenu()">Меню</button>
    <nav class="main-nav" id="main-nav">
